<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="dsh-effort-pilot logo">
  <title>dsh-effort-pilot</title>
  <desc>An autopilot dial next to an ascending three-step thinking-effort ladder.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121d33"/>
      <stop offset="1" stop-color="#070b14"/>
    </linearGradient>
    <linearGradient id="barLow" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2f5bd0"/>
      <stop offset="1" stop-color="#5b8cff"/>
    </linearGradient>
    <linearGradient id="barMid" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#3f6ee6"/>
      <stop offset="1" stop-color="#7fa6ff"/>
    </linearGradient>
    <linearGradient id="barMax" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#6d5bff"/>
      <stop offset="1" stop-color="#b79bff"/>
    </linearGradient>
    <linearGradient id="needle" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#cfe0ff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#bg)"/>
  <rect x="8.75" y="8.75" width="238.5" height="238.5" rx="57.25" fill="none" stroke="#22355c" stroke-width="1.5"/>

  <!-- effort ladder: low / high / max -->
  <g filter="url(#soft)">
    <rect x="50" y="152" width="30" height="56" rx="10" fill="url(#barLow)"/>
    <rect x="92" y="122" width="30" height="86" rx="10" fill="url(#barMid)"/>
    <rect x="134" y="86" width="30" height="122" rx="10" fill="url(#barMax)"/>
  </g>

  <!-- autopilot dial -->
  <path d="M175 96 A46 46 0 0 1 221 142" fill="none" stroke="#4f8cff" stroke-opacity="0.5" stroke-width="8" stroke-linecap="round"/>
  <g filter="url(#soft)">
    <line x1="196" y1="160" x2="212" y2="124" stroke="url(#needle)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="196" cy="160" r="7.5" fill="#eaf2ff"/>
  </g>
</svg>
